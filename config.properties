# Local LLM runtime configuration
local.provider=ollama
local.model=llama3.1:8b
local.ollamaCommand=ollama
# Optional absolute path if PATH differs for GUI/.exe launch context.
# Example: C:\Users\<you>\AppData\Local\Programs\Ollama\ollama.exe
local.ollamaPath=C:\Users\orowa\AppData\Local\Programs\Ollama\ollama.exe
local.temperature=0.1

# Optional ChatGPT cross-check (uses env var, never hardcoded key)
openai.model=gpt-4o-mini
openai.apiKeyEnv=
openai.baseUrl=https://api.openai.com/v1/chat/completions
claude.model=claude-3-5-sonnet-20241022
claude.apiKeyEnv=ANTHROPIC_API_KEY
claude.baseUrl=https://api.anthropic.com/v1/messages

# ZIP summarization limits before local inference
analysis.maxFiles=300
analysis.maxBytesPerFile=9000
analysis.maxTotalChars=180000

# Learning memory controls
learning.maxExamples=12

# Optional SonarQube server (python-sonarqube-api): fetch issues for a project to enhance analysis.
# Set SONAR_TOKEN (or sonar.tokenEnv) in environment; leave URL/projectKey empty to disable.
sonar.url=https://sonarcloud.io/
sonar.tokenEnv=
sonar.projectKey=
